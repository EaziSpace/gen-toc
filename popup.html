<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gen TOC</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="icons/icon48.png" alt="" width="22" height="22">
    <h1>Gen TOC</h1>
    <span class="version" id="version"></span>
  </header>

  <section class="card current">
    <div class="row">
      <div class="site">
        <div class="site-name" id="site-name">This page</div>
        <div class="site-status" id="site-status">Checking…</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="site-toggle" role="switch" aria-label="Show on this site" disabled>
        <span class="track"></span>
      </label>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <span class="label">Position</span>
      <div class="segmented" role="radiogroup" aria-label="Position">
        <button type="button" role="radio" data-position="left" aria-checked="false">Left</button>
        <button type="button" role="radio" data-position="right" aria-checked="false">Right</button>
      </div>
    </div>
    <div class="row">
      <span class="label">Shortcut</span>
      <button type="button" class="shortcut" id="shortcut" title="Change the shortcut">
        <kbd id="shortcut-keys">Not set</kbd>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
  </section>

  <details class="card sites">
    <summary>
      <span class="label">Sites</span>
      <span class="muted" id="sites-count"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </summary>
    <ul id="sites-list"></ul>
    <p class="hint">Also on by default for blog.* sites and local files.</p>
  </details>

  <footer>
    Made by
    <a href="https://www.linkedin.com/in/iductruong/" target="_blank" rel="noopener noreferrer">Jay</a>
  </footer>

  <script src="site-rules.js"></script>
  <script src="popup.js"></script>
</body>
</html>
